<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/world3d.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<!-- FASE 1: LOGIN -->
<section id="login">
  <div class="carta">
    <svg class="hilo" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
      <rect class="hilo-linea" x="4" y="4" width="992" height="592" rx="22" pathLength="1"/>
      <rect class="hilo-puntada" x="16" y="16" width="968" height="568" rx="16"/>
    </svg>
    <span class="corazon c1">♥</span><span class="corazon c2">♥</span>
    <span class="corazon c3">♥</span><span class="corazon c4">♥</span>

    <div class="album">
      <div class="foto-marco">
        <img id="foto" alt="Foto del álbum">
        <div id="foto-vacia" hidden>♡</div>
      </div>
      <p id="pie" class="pie"></p>
      <div class="album-nav">
        <button id="prev" aria-label="Anterior">‹</button>
        <button id="next" aria-label="Siguiente">›</button>
      </div>
    </div>

    <div class="panel">
      <h1>Ingresa nuestra fecha especial</h1>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="teclado">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="del" class="accion">Borrar</button>
        <button data-k="0">0</button>
        <button data-k="enter" class="accion">Entrar</button>
      </div>
    </div>
  </div>
</section>

<!-- FASE 2: MUNDO 3D -->
<div id="mundo" hidden>
  <canvas id="c"></canvas>
  <button id="sobre" hidden><span class="sobre-ico">✉</span><span id="sobre-txt"></span></button>
  <div id="nota-overlay" hidden>
    <article id="nota">
      <h2 id="nota-titulo"></h2>
      <p id="nota-texto"></p>
      <button id="nota-cerrar">Cerrar</button>
    </article>
  </div>
  <div class="hint" id="hint">Arrastra para mirar a tu alrededor</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
